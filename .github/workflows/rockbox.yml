name: Build Rockbox for FiiO M3K

# Every push builds the firmware and the bootloader and keeps them as a
# workflow artifact. A release is published, and the web installer on
# GitHub Pages (pages.yml) updated to it:
#   - when a tag v* is pushed (git tag v1.0.0 && git push origin v1.0.0), or
#   - from the Actions tab: "Run workflow", with the version to publish
#     (the tag is created on the selected branch).

on:
  push:
    branches:
      - '**'
    paths:
      - 'apps/**'
      - 'bootloader/**'
      - 'firmware/**'
      - 'lib/**'
      - 'fonts/**'
      - 'tools/**'
      - 'uisimulator/**'
      - '.github/workflows/rockbox.yml'
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g. v1.0.0); empty: build only'
        required: false
        default: ''
      prerelease:
        description: 'Mark as pre-release'
        type: boolean
        default: false

concurrency:
  group: rockbox-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-firmware:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    outputs:
      release: ${{ steps.version.outputs.release }}
      tag: ${{ steps.version.outputs.name }}

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Release version
      id: version
      run: |
        if [ "${{ github.ref_type }}" = "tag" ]; then
          VERSION="${{ github.ref_name }}"
        else
          VERSION="${{ github.event.inputs.version }}"
        fi
        if [ -n "$VERSION" ]; then
          case "$VERSION" in v*) ;; *) VERSION="v$VERSION" ;; esac
          echo "release=true" >> $GITHUB_OUTPUT
          echo "name=$VERSION" >> $GITHUB_OUTPUT
        else
          echo "release=false" >> $GITHUB_OUTPUT
          echo "name=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
        fi

    - name: Install Dependencies for Toolchain Build
      run: |
        sudo apt-get update
        # Install deps required by rockboxdev.sh and the build
        sudo apt-get install -y build-essential git zip unzip libsdl1.2-dev flex bison texinfo \
          curl automake libtool libtool-bin autoconf libmpc-dev libgmp-dev libmpfr-dev \
          gawk perl
        # Note: gcc-mipsel-linux-gnu is NOT needed as we build our own toolchain

    - name: Cache Rockbox Toolchain
      id: cache-toolchain
      uses: actions/cache@v4
      with:
        path: /opt/mips
        # Key based on rockboxdev.sh content ensures rebuild if script changes
        key: rockbox-toolchain-mips-ubuntu-24.04-${{ hashFiles('tools/rockboxdev.sh') }}

    - name: Build Rockbox Toolchain
      if: steps.cache-toolchain.outputs.cache-hit != 'true'
      run: |
        sudo mkdir -p /opt/mips
        sudo chown $USER /opt/mips
        # 'i' is the target for MIPS (Bare Metal) in rockboxdev.sh
        ./tools/rockboxdev.sh --target=i --prefix=/opt/mips --dlwhere=/tmp/rbdev-dl \
          --builddir=/tmp/rbdev-build --makeflags=-j$(nproc)

    - name: Add Toolchain to PATH
      run: echo "/opt/mips/bin" >> $GITHUB_PATH

    - name: Build the firmware
      run: |
        mkdir -p build
        cd build
        ../tools/configure --target=fiiom3k --type=N --ram=0
        make -j$(nproc)
        ls -l rockbox.m3k
        # crt0.S copies and clears the sections 4 bytes at a time and stops
        # only on an exact match: a misaligned boundary hangs the player at
        # power on with a black screen
        mipsel-elf-nm rockbox.elf | awk '
          $3 ~ /^(_bssbegin|_bssend|_iramstart|_iramend|_initstart|_initend|_tcsmstart|_tcsmend|stackbegin|stackend|_irqstackbegin|_irqstackend)$/ {
            if (index("048c", substr($1, length($1))) == 0) { print "misaligned " $3 " " $1; bad = 1 }
          }
          END { exit bad }'
        # rockbox.zip: .rockbox with firmware, codecs, languages, ...
        make zip

    - name: Build the bootloader
      run: |
        mkdir -p build-bootloader
        cd build-bootloader
        ../tools/configure --target=fiiom3k --type=B
        make -j$(nproc)
        ls -l bootloader.ucl bootloader.m3k
        # the SPL loads at most 102 KiB from flash, and the installer refuses
        # anything bigger (installer-ingenic.c)
        size=$(stat -c %s bootloader.ucl)
        if [ "$size" -gt $((102 * 1024)) ]; then
          echo "bootloader.ucl is $size bytes, over the 102 KiB limit"; exit 1
        fi

    - name: Assemble the package
      run: |
        PKG=osmium-pod-fiiom3k-${{ steps.version.outputs.name }}
        echo "PKG=$PKG" >> $GITHUB_ENV
        mkdir -p release
        (cd release && unzip -q ../build/rockbox.zip)

        # Fallback font for the scripts the built-in fonts do not cover
        # (CJK, ...): Osmium Sound picks it up from .rockbox/fonts.
        make -C tools convbdf
        mkdir -p release/.rockbox/fonts
        ./tools/convbdf -f -o release/.rockbox/fonts/16-GNU-Unifont.fnt fonts/16-GNU-Unifont.bdf

        # The bootloader (Rockbox in flash) is a separate release file, so
        # copying the package to the card never changes it by accident.
        cp build-bootloader/bootloader.m3k bootloader.m3k

        cat > release/INSTALL.txt <<'EOF'
        Osmium Pod - Osmium Sound for the FiiO M3K
        ==========================================

        Easiest: use the web installer, from Chrome or Edge:
          https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/

        Update (Rockbox bootloader already on the player):
          1. Connect the M3K over USB (or put the microSD card in a reader).
          2. Copy everything in this archive to the root of the card,
             overwriting the files already there (merge the .rockbox
             folder: settings and database are kept).
          3. Eject and restart the player. With the Osmium Pod bootloader,
             the copy in flash is updated at the next start.

        First installation by hand:
          Either install the OFFICIAL Rockbox bootloader for the FiiO M3K
          (https://download.rockbox.org/), which starts Rockbox from the
          card and keeps the FiiO firmware; or install bootloader.m3k from
          this release, which puts Rockbox in the internal flash in place of
          the FiiO firmware (see README.md, "Rockbox in flash").
        EOF

        (cd release && zip -qr ../$PKG.zip .)
        ls -l $PKG.zip

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ${{ env.PKG }}
        path: |
          release/
          bootloader.m3k
        include-hidden-files: true

    - name: Publish the release
      if: steps.version.outputs.release == 'true'
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ steps.version.outputs.name }}
        target_commitish: ${{ github.sha }}
        name: Osmium Pod ${{ steps.version.outputs.name }}
        prerelease: ${{ github.event.inputs.prerelease == 'true' }}
        generate_release_notes: true
        body: |
          Osmium Sound for the FiiO M3K.

          **Install from the browser**: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/

          **Update**: unzip `${{ env.PKG }}.zip` to the root of the M3K's
          microSD card (overwrite the files in `.rockbox`) and restart the
          player.

          `bootloader.m3k` puts Rockbox in the player's internal flash, in
          place of the FiiO firmware. The package also works with the
          official Rockbox bootloader (https://download.rockbox.org/), which
          starts it from the card. See `INSTALL.txt`.
        files: |
          ${{ env.PKG }}.zip
          bootloader.m3k

  # Point the web installer at the release just published (not for
  # pre-releases). The tag is passed on: right after publishing, GitHub
  # can still report the previous release as the latest.
  pages:
    needs: build-firmware
    if: needs.build-firmware.outputs.release == 'true' && github.event.inputs.prerelease != 'true'
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/pages.yml
    with:
      tag: ${{ needs.build-firmware.outputs.tag }}

name: Web installer (GitHub Pages)

# Publishes site/ on GitHub Pages together with the latest release's files
# (package zip and bootloader.m3k), so the page downloads them from its own
# origin (GitHub release downloads have no CORS headers).
# Runs when the site changes, by hand, and from rockbox.yml after a release.
#
# The site goes to the gh-pages branch (Pages source: that branch), one new
# commit per publish. A Pages deployment from Actions is keyed by the commit
# instead, so a release tagged on the commit master had just deployed kept
# the old files.

on:
  push:
    branches:
      - master
    paths:
      - 'site/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:
  workflow_call:
    inputs:
      tag:
        description: 'Release to publish; empty: the latest release'
        type: string
        default: ''

permissions:
  contents: write
  pages: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Add the latest release
      env:
        GH_TOKEN: ${{ github.token }}
        TAG: ${{ inputs.tag }}
      run: |
        mkdir -p _site/firmware
        cp -r site/. _site/
        # browsers keep the page's files for 10 minutes: new names each time
        V="${GITHUB_SHA::10}"
        sed -i "s#\"app.js\"#\"app.js?v=$V\"#; s#\"style.css\"#\"style.css?v=$V\"#" _site/index.html
        sed -i "s#\"./lib.js\"#\"./lib.js?v=$V\"#" _site/app.js
        grep -c "?v=$V" _site/index.html _site/app.js

        # by default the latest release that is not a draft or a pre-release
        if [ -z "$TAG" ] && ! TAG=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName -q .tagName); then
          echo "No release yet: the page says so"
          echo '{}' > _site/firmware/manifest.json
          exit 0
        fi

        cd _site/firmware
        gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern 'osmium-pod-fiiom3k-*.zip'
        if ! gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern 'bootloader.m3k'; then
          echo "::warning::release $TAG has no bootloader.m3k: the installer stays disabled"
        fi
        if ! gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern 'installer.m3k'; then
          echo "::warning::release $TAG has no installer.m3k: no direct install"
        fi
        mv osmium-pod-fiiom3k-*.zip osmium-pod-fiiom3k.zip

        BOOTLOADER=null
        INSTALLER=null
        [ -f bootloader.m3k ] && BOOTLOADER='"firmware/bootloader.m3k"'
        [ -f installer.m3k ] && INSTALLER='"firmware/installer.m3k"'
        gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json tagName,publishedAt,url \
          | jq --argjson bl "$BOOTLOADER" --argjson inst "$INSTALLER" '{
              version: .tagName,
              published: .publishedAt,
              url: .url,
              package: "firmware/osmium-pod-fiiom3k.zip",
              bootloader: $bl,
              installer: $inst
            }' > manifest.json
        cat manifest.json
        ls -l

    - name: Publish to the gh-pages branch
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        cd _site
        touch .nojekyll     # serve the files as they are
        git init -q -b gh-pages
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git add -A
        git commit -q -m "Web installer for ${GITHUB_SHA::10}"
        git push -q --force "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
        # ask for a build, in case the push alone does not start one
        gh api -X POST "repos/${GITHUB_REPOSITORY}/pages/builds" >/dev/null || true
